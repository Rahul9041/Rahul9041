<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">Rahul Paul - DevOps Engineer</title>
  <desc id="desc">Custom profile banner for Rahul Paul. DevOps engineer. CI/CD, Docker, Kubernetes, AWS.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07090F"/>
      <stop offset="48%" stop-color="#0C1220"/>
      <stop offset="100%" stop-color="#10161A"/>
    </linearGradient>
    <linearGradient id="copper" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E8B86D"/>
      <stop offset="100%" stop-color="#7EE0C8"/>
    </linearGradient>
    <linearGradient id="hexfill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#152033"/>
      <stop offset="100%" stop-color="#0E1624"/>
    </linearGradient>
    <radialGradient id="glow" cx="18%" cy="30%" r="42%">
      <stop offset="0%" stop-color="#E8B86D" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#E8B86D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="86%" cy="70%" r="38%">
      <stop offset="0%" stop-color="#7EE0C8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#7EE0C8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.1" fill="#9BB6C9" fill-opacity="0.09"/>
    </pattern>
  </defs>

  <rect width="1280" height="420" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="18" fill="url(#dots)"/>
  <rect width="1280" height="420" fill="url(#glow)"/>
  <rect width="1280" height="420" fill="url(#glow2)"/>
  <rect x="1" y="1" width="1278" height="418" rx="17" fill="none" stroke="#2A3A4A" stroke-opacity="0.7"/>
  <rect x="0" y="0" width="8" height="420" rx="4" fill="url(#copper)"/>

  <!-- RP hex monogram -->
  <g transform="translate(56,118)">
    <polygon points="92,8 156,44 156,118 92,154 28,118 28,44" fill="url(#hexfill)" stroke="#E8B86D" stroke-width="2.2"/>
    <text x="92" y="102" text-anchor="middle" fill="#F6E7C8" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="52" font-weight="700" letter-spacing="1">RP</text>
  </g>

  <!-- identity -->
  <g font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="268" y="148" fill="#E8B86D" font-size="15" font-weight="700" letter-spacing="4.2">BENGALURU  ·  OPEN TO WORK</text>
    <text x="264" y="218" fill="#F7F4EE" font-size="64" font-weight="700" letter-spacing="-1.5">Rahul Paul</text>
    <text x="268" y="268" fill="#C9D6E2" font-size="26">DevOps Engineer  ·  Cloud  ·  Kubernetes</text>
    <rect x="268" y="290" width="92" height="3.5" rx="2" fill="url(#copper)"/>
    <text x="268" y="334" fill="#8FA3B5" font-size="18">Commit  to  pipeline  to  container  to  cluster</text>
  </g>

  <!-- ops console -->
  <g transform="translate(868,78)">
    <rect width="352" height="264" rx="16" fill="#0A1018" stroke="#243140"/>
    <circle cx="28" cy="26" r="6" fill="#E07A5F"/>
    <circle cx="48" cy="26" r="6" fill="#E8B86D"/>
    <circle cx="68" cy="26" r="6" fill="#7EE0C8"/>
    <text x="96" y="31" fill="#6F8496" font-size="13" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif">delivery-plane</text>
    <line x1="0" y1="48" x2="352" y2="48" stroke="#243140"/>

    <g font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace" font-size="14">
      <text x="24" y="84" fill="#6F8496">$</text>
      <text x="42" y="84" fill="#7EE0C8">git push origin main</text>
      <text x="24" y="118" fill="#6F8496">&gt;</text>
      <text x="42" y="118" fill="#E8B86D">jenkins  build  # package</text>
      <text x="24" y="152" fill="#6F8496">&gt;</text>
      <text x="42" y="152" fill="#C9D6E2">docker   push   rahul9041/*</text>
      <text x="24" y="186" fill="#6F8496">&gt;</text>
      <text x="42" y="186" fill="#C9D6E2">kubectl  apply  -f k8s/</text>
      <text x="24" y="228" fill="#7EE0C8">status   ready</text>
    </g>
  </g>
</svg>
