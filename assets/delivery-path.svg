<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="220" viewBox="0 0 1280 220" role="img" aria-labelledby="title">
  <title id="title">Delivery path: GitHub to Jenkins to Docker to Kubernetes to AWS</title>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E8B86D"/>
      <stop offset="100%" stop-color="#7EE0C8"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="220" rx="16" fill="#0B1220"/>
  <rect x="1" y="1" width="1278" height="218" rx="15" fill="none" stroke="#243140"/>
  <text x="40" y="42" fill="#E8B86D" font-size="13" font-weight="700" letter-spacing="3.2" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif">HOW THE WORK MOVES</text>

  <g font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="40" y="72" width="200" height="100" rx="14" fill="#121A28" stroke="#2A3A4A"/>
    <text x="140" y="116" text-anchor="middle" fill="#F7F4EE" font-size="20" font-weight="700">GitHub</text>
    <text x="140" y="142" text-anchor="middle" fill="#8FA3B5" font-size="13">source of truth</text>

    <rect x="280" y="72" width="200" height="100" rx="14" fill="#121A28" stroke="#2A3A4A"/>
    <text x="380" y="116" text-anchor="middle" fill="#F7F4EE" font-size="20" font-weight="700">Jenkins</text>
    <text x="380" y="142" text-anchor="middle" fill="#8FA3B5" font-size="13">build and deploy</text>

    <rect x="520" y="72" width="200" height="100" rx="14" fill="#121A28" stroke="#2A3A4A"/>
    <text x="620" y="116" text-anchor="middle" fill="#F7F4EE" font-size="20" font-weight="700">Docker</text>
    <text x="620" y="142" text-anchor="middle" fill="#8FA3B5" font-size="13">rahul9041 images</text>

    <rect x="760" y="72" width="200" height="100" rx="14" fill="#121A28" stroke="#2A3A4A"/>
    <text x="860" y="116" text-anchor="middle" fill="#F7F4EE" font-size="20" font-weight="700">Kubernetes</text>
    <text x="860" y="142" text-anchor="middle" fill="#8FA3B5" font-size="13">pods and services</text>

    <rect x="1000" y="72" width="236" height="100" rx="14" fill="#121A28" stroke="#2A3A4A"/>
    <text x="1118" y="116" text-anchor="middle" fill="#F7F4EE" font-size="20" font-weight="700">AWS</text>
    <text x="1118" y="142" text-anchor="middle" fill="#8FA3B5" font-size="13">EC2 · S3 · CloudFront</text>
  </g>

  <path d="M240 122h40M480 122h40M720 122h40M960 122h40" stroke="url(#line)" stroke-width="3"/>
  <polygon points="280,122 270,117 270,127" fill="#E8B86D"/>
  <polygon points="520,122 510,117 510,127" fill="#E8B86D"/>
  <polygon points="760,122 750,117 750,127" fill="#7EE0C8"/>
  <polygon points="1000,122 990,117 990,127" fill="#7EE0C8"/>
</svg>
