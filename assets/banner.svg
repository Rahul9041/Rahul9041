    <rect x="56" y="220" width="86" height="3" rx="2" fill="url(#accent)"/>
    <text x="56" y="258" fill="#8EA3B7" font-size="16">Jenkins  ·  Docker  ·  Kubernetes  ·  AWS</text>
    <text x="56" y="288" fill="#6F8496" font-size="14">rahul9041.github.io</text>
  </g>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="868" y="118" width="108" height="54" rx="10" fill="url(#card)" stroke="#1E3A4C"/>
    <rect x="1000" y="118" width="108" height="54" rx="10" fill="url(#card)" stroke="#1E3A4C"/>
    <rect x="1132" y="118" width="92" height="54" rx="10" fill="url(#card)" stroke="#1E3A4C"/>
    <text x="922" y="140" text-anchor="middle" fill="#93A4B8" font-size="10" letter-spacing="1.5">BUILD</text>
    <text x="922" y="158" text-anchor="middle" fill="#E8F3F1" font-size="13" font-weight="700">Jenkins</text>
    <text x="1054" y="140" text-anchor="middle" fill="#93A4B8" font-size="10" letter-spacing="1.5">SHIP</text>
    <text x="1054" y="158" text-anchor="middle" fill="#E8F3F1" font-size="13" font-weight="700">Docker</text>
    <text x="1178" y="140" text-anchor="middle" fill="#93A4B8" font-size="10" letter-spacing="1.5">RUN</text>
